services:
  - type: web
    name: hardware-deals-api
    runtime: docker
    plan: starter
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: hardware-deals-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hardware-deals-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hardware-deals-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: hardware-deals-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hardware-deals-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hardware-deals-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://gouvea-code.github.io
      - key: COLLECTOR_ENABLED
        value: "true"
      - key: MERCADO_LIVRE_ENABLED
        value: "true"
      - key: MERCADO_LIVRE_ACCESS_TOKEN
        sync: false
      - key: MERCADO_LIVRE_QUERY
        value: hardware computador
      - key: FIREBASE_ENABLED
        value: "false"
      - key: ALERT_ENGINE_ENABLED
        value: "false"
      - key: DISTRIBUTED_RATE_LIMIT_ENABLED
        value: "true"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
  - type: keyvalue
    name: hardware-deals-cache
    plan: free
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: hardware-deals-db
    plan: basic-256mb
    region: ohio
    databaseName: hardware_deals
    user: hardware_deals
    postgresMajorVersion: "16"
    ipAllowList: []
