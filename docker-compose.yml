version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hardware-deals-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hardware_deals
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardware_deals"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hardware-deals-network

  redis:
    image: redis:7-alpine
    container_name: hardware-deals-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hardware-deals-network

volumes:
  postgres_data:
  redis_data:

networks:
  hardware-deals-network:
    driver: bridge
