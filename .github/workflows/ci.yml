name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - id: unit-tests
        continue-on-error: true
        run: mvn --batch-mode test
      - name: Report unit test failures
        if: steps.unit-tests.outcome == 'failure'
        run: |
          find target/surefire-reports -type f -name '*.txt' -print0 \
            | xargs -0 grep -h -E 'Tests run:|<<< FAILURE|<<< ERROR|Caused by:|^[[:space:]]+at com\.hardwaredeals' \
            | head -n 40 \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
          exit 1

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - id: integration-tests
        continue-on-error: true
        run: mvn --batch-mode -Dintegration test
      - name: Report integration test failures
        if: steps.integration-tests.outcome == 'failure'
        run: |
          find target/surefire-reports -type f -name '*.txt' -print0 \
            | xargs -0 grep -h -E 'Tests run:|<<< FAILURE|<<< ERROR|Caused by:|^[[:space:]]+at com\.hardwaredeals' \
            | head -n 40 \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
          exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: cp .env.development.example .env.development
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm audit --audit-level=critical
        working-directory: mobile
