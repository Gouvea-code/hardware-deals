name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode -DskipTests compile
      - id: unit-tests
        continue-on-error: true
        run: mvn --batch-mode test
      - name: Report unit test failures
        if: steps.unit-tests.outcome == 'failure'
        run: |
          find target/surefire-reports -type f -name '*.txt' -print0 \
            | xargs -0 grep -h -E '<<< FAILURE|<<< ERROR|Caused by:|^[[:space:]]+at com\.hardwaredeals' \
            | head -n 80 \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
          exit 1

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - id: integration-tests
        continue-on-error: true
        run: mvn --batch-mode -Dintegration test
      - name: Report integration test failures
        if: steps.integration-tests.outcome == 'failure'
        run: |
          find target/surefire-reports -type f -name '*.txt' -print0 \
            | xargs -0 grep -h -E '<<< FAILURE|<<< ERROR|Caused by:|^[[:space:]]+at com\.hardwaredeals' \
            | head -n 80 \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
          exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: cp .env.development.example .env.development
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm audit --audit-level=critical
        working-directory: mobile

  performance-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD/performance/k6:/scripts:ro" grafana/k6:0.57.0 inspect /scripts/api-load.js

  release-candidate:
    needs: [backend-unit, backend-integration, mobile, security-audit, performance-script]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode -DskipTests package
      - run: docker build -t hardware-deals:${{ github.sha }} .
      - uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: backend/target/*.jar
          retention-days: 14
