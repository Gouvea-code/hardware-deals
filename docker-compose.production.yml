services:
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - tls-cert
      - tls-key

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      DISTRIBUTED_RATE_LIMIT_ENABLED: "true"
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-true}
      ALERT_ENGINE_ENABLED: ${ALERT_ENGINE_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-true}
      MERCADO_LIVRE_ENABLED: ${MERCADO_LIVRE_ENABLED:-false}
      MERCADO_LIVRE_API_URL: ${MERCADO_LIVRE_API_URL:-}
      MERCADO_LIVRE_ACCESS_TOKEN: ${MERCADO_LIVRE_ACCESS_TOKEN:-}
      AMAZON_BRASIL_ENABLED: ${AMAZON_BRASIL_ENABLED:-false}
      AMAZON_BRASIL_API_URL: ${AMAZON_BRASIL_API_URL:-}
      AMAZON_BRASIL_ACCESS_TOKEN: ${AMAZON_BRASIL_ACCESS_TOKEN:-}
      KABUM_ENABLED: ${KABUM_ENABLED:-false}
      KABUM_API_URL: ${KABUM_API_URL:-}
      KABUM_ACCESS_TOKEN: ${KABUM_ACCESS_TOKEN:-}
      MAGAZINE_LUIZA_ENABLED: ${MAGAZINE_LUIZA_ENABLED:-false}
      MAGAZINE_LUIZA_API_URL: ${MAGAZINE_LUIZA_API_URL:-}
      MAGAZINE_LUIZA_ACCESS_TOKEN: ${MAGAZINE_LUIZA_ACCESS_TOKEN:-}
    secrets:
      - firebase-service-account
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"

  backup:
    image: postgres:16-alpine
    profiles: [maintenance]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./ops/scripts:/scripts:ro
      - postgres_backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-postgres.sh"]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  postgres_backups:

secrets:
  firebase-service-account:
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE}
  tls-cert:
    file: ${TLS_CERT_FILE}
  tls-key:
    file: ${TLS_KEY_FILE}
