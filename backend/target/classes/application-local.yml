spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hardware_deals_dev
    username: postgres
    password: postgres
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

logging:
  level:
    root: INFO
    com.hardwaredeals: DEBUG
    org.springframework.web: DEBUG
