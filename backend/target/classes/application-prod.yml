spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: false

logging:
  level:
    root: WARN
    com.hardwaredeals: INFO

server:
  ssl:
    enabled: true
