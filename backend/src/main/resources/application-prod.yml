spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  auth:
    jwt-secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM}

logging:
  level:
    root: WARN
    com.hardwaredeals: INFO

server:
  ssl:
    enabled: true
