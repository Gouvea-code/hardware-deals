spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      url: ${REDIS_URL:}
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  auth:
    jwt-secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
  alert-engine:
    enabled: ${ALERT_ENGINE_ENABLED:true}
  security:
    allowed-origins: ${ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.hardwaredeals: INFO

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
