spring:
  application:
    name: hardware-deals-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/hardware_deals
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
  
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.hardwaredeals: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  auth:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    access-token-ttl: PT15M
    rate-limit-per-minute: 10
    distributed-rate-limit-enabled: ${DISTRIBUTED_RATE_LIMIT_ENABLED:true}
  mail:
    from: ${MAIL_FROM:no-reply@hardwaredeals.local}
  collector:
    enabled: ${COLLECTOR_ENABLED:false}
    feed-url: ${COLLECTOR_FEED_URL:}
    cron: ${COLLECTOR_CRON:0 0 * * * *}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
  alert-engine:
    enabled: ${ALERT_ENGINE_ENABLED:false}
    cron: ${ALERT_ENGINE_CRON:0 */15 * * * *}
    cooldown: ${ALERT_NOTIFICATION_COOLDOWN:PT24H}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  analytics:
    retention: ${ANALYTICS_RETENTION:P90D}
    cleanup-cron: ${ANALYTICS_CLEANUP_CRON:0 30 3 * * *}
  admin:
    bootstrap-email: ${APP_ADMIN_EMAIL:}
