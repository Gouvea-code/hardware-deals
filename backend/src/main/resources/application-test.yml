spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  flyway:
    enabled: false
  
  redis:
    host: localhost
    port: 6379
    timeout: 1000
  mail:
    host: localhost
    port: 2525

logging:
  level:
    root: INFO
    com.hardwaredeals: DEBUG

app:
  auth:
    jwt-secret: test-only-secret-with-at-least-32-bytes-long
    rate-limit-per-minute: 100

management:
  health:
    mail:
      enabled: false
